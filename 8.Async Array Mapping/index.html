<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let arr = [1, 2, 3, 4, 5];
      async function newArray(arr) {
       let promise = arr.map((x) => {
         return new Promise((resolve) => {
           setTimeout(() => {
             resolve(x * 2);
           }, 1000);
         });
       })
       let result = await Promise.all(promise);
       console.log(result);
      }
      async function main() {
        await newArray(arr);
        console.log("Array has been processed.");
      }
      main();
    </script>
  </body>
</html>
